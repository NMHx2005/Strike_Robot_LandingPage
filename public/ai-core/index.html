<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StrikeRobot AI Core - Cinematic Realistic</title>
  <style>
    body {
      margin: 0;
      overflow: hidden; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: radial-gradient(circle at center, #ffffff 0%, #e0e0e0 100%);
    }
    canvas {
      display: block;
      position: absolute;
    }
  </style>
</head>
<body>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // 1. KHỞI TẠO SCENE & CAMERA
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 4.5;

    // Cấu hình Renderer chuẩn Cinematic
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.physicallyCorrectLights = true; 
    document.body.appendChild(renderer.domElement);

    // 2. HỆ THỐNG ÁNH SÁNG STUDIO
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 4);
    mainLight.position.set(-5, 10, 5);
    scene.add(mainLight);

    const cyanAccentLight = new THREE.PointLight(0x00f3ff, 8, 10);
    cyanAccentLight.position.set(0, -3, 2);
    scene.add(cyanAccentLight);

    // 3. TẠO GROUP CHỨA KHỐI
    const coreGroup = new THREE.Group();
    scene.add(coreGroup);

    // --- KHỐI BÊN NGOÀI: KÍNH PHA LÊ TRẮNG BÓNG ---
    const icoGeometry = new THREE.IcosahedronGeometry(1.5);
    const icoMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      metalness: 0.2,       
      roughness: 0.05,      
      transmission: 0.9,    
      thickness: 1.0,       
      clearcoat: 1.0,       
      clearcoatRoughness: 0.1,
      transparent: true,
      side: THREE.DoubleSide
    });
    const icosahedron = new THREE.Mesh(icoGeometry, icoMaterial);
    coreGroup.add(icosahedron);
    
    const edges = new THREE.EdgesGeometry(icoGeometry);
    const wireframe = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ 
        color: 0xaaaaaa, 
        transparent: true, 
        opacity: 0.4 
    }));
    icosahedron.add(wireframe);

    // --- KHỐI BÊN TRONG: KIM LOẠI ĐEN NHÁM (DARK CHROME) ---
    const boxGeometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
    const boxMaterial = new THREE.MeshStandardMaterial({
      color: 0x111111,
      metalness: 1.0,
      roughness: 0.2,
    });
    const innerBox = new THREE.Mesh(boxGeometry, boxMaterial);
    coreGroup.add(innerBox);

    const innerEdges = new THREE.EdgesGeometry(boxGeometry);
    const innerWireframe = new THREE.LineSegments(innerEdges, new THREE.LineBasicMaterial({ 
        color: 0x00f3ff,
        transparent: true, 
        opacity: 0.6 
    }));
    innerBox.add(innerWireframe);

    // 4. THÊM LOGO
    const textureLoader = new THREE.TextureLoader();
    const logoTexture = textureLoader.load('Logo.png');

    const logoGeometry = new THREE.PlaneGeometry(1.8, 0.6);
    const logoMaterial = new THREE.MeshBasicMaterial({
      map: logoTexture,
      transparent: true,
      depthWrite: false,
      color: 0x000000 
    });

    const logoMeshFront = new THREE.Mesh(logoGeometry, logoMaterial);
    logoMeshFront.position.set(0, 0, 1.6); 
    icosahedron.add(logoMeshFront);

    const logoMeshBack = new THREE.Mesh(logoGeometry, logoMaterial);
    logoMeshBack.position.set(0, 0, -1.6); 
    logoMeshBack.rotation.y = Math.PI; 
    icosahedron.add(logoMeshBack);

    // 5. TƯƠNG TÁC CHUỘT & HOVER ANIMATION (RAYCASTER)
    let mouseX = 0, mouseY = 0;
    let targetX = 0, targetY = 0;
    const windowHalfX = window.innerWidth / 2;
    const windowHalfY = window.innerHeight / 2;

    // Các biến xử lý Raycaster và trạng thái Hover
    const raycaster = new THREE.Raycaster();
    const mouseNDC = new THREE.Vector2(-1, -1); // Tọa độ chuẩn hóa (Normalized Device Coordinates)
    let isHovered = false;
    let hoverTimeout = null;
    let targetScale = 1.0; // Mặc định 100%

    document.addEventListener('mousemove', (event) => {
      // Tọa độ cho hiệu ứng xoay (Parallax)
      mouseX = (event.clientX - windowHalfX);
      mouseY = (event.clientY - windowHalfY);

      // Tọa độ chuẩn hóa cho Raycaster (từ -1 đến +1)
      mouseNDC.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouseNDC.y = -(event.clientY / window.innerHeight) * 2 + 1;
    });

    function animate() {
      requestAnimationFrame(animate);

      // Xử lý xoay theo chuột (Parallax)
      targetX = mouseX * 0.0015;
      targetY = mouseY * 0.0015;
      coreGroup.rotation.y += 0.05 * (targetX - coreGroup.rotation.y);
      coreGroup.rotation.x += 0.05 * (targetY - coreGroup.rotation.x);

      // Xoay tự động
      icosahedron.rotation.y += 0.002;
      innerBox.rotation.x -= 0.003;
      innerBox.rotation.y -= 0.001;

      // --- LOGIC RAYCASTER KÍCH HOẠT HOVER ---
      raycaster.setFromCamera(mouseNDC, camera);
      // Kiểm tra xem chuột có đang nằm trên khối icosahedron không
      const intersects = raycaster.intersectObject(icosahedron);

      if (intersects.length > 0) {
        if (!isHovered) {
          clearTimeout(hoverTimeout); // Hủy lệnh thu nhỏ nếu có
          isHovered = true;
          targetScale = 1.35; // Scale lên 135% (nằm trong khoảng 30-40% bạn yêu cầu)
        }
      } else {
        if (isHovered) {
          isHovered = false;
          // Đợi 2 giây (2000ms) trước khi thu về bình thường
          hoverTimeout = setTimeout(() => {
            targetScale = 1.0;
          }, 2000);
        }
      }

      // Ứng dụng scale mượt mà (Lerp)
      icosahedron.scale.x += (targetScale - icosahedron.scale.x) * 0.1;
      icosahedron.scale.y += (targetScale - icosahedron.scale.y) * 0.1;
      icosahedron.scale.z += (targetScale - icosahedron.scale.z) * 0.1;

      renderer.render(scene, camera);
    }
    animate();

    // Xử lý Responsive khi đổi kích thước cửa sổ
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
